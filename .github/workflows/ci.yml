name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-and-web:
    name: spec, sdk, web (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @trustmcp/spec build && pnpm --filter @trustmcp/sdk build
      - name: Validate example profiles against JSON Schemas
        run: pnpm spec:validate
      - name: Test @trustmcp/spec
        run: pnpm --filter @trustmcp/spec test
      - name: Test @trustmcp/web (unit)
        run: pnpm --filter @trustmcp/web test
      - name: Typecheck + build web
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-secret-ci-secret-ci-secret-xxxx
        run: pnpm --filter @trustmcp/web build
      - name: Build docs site
        run: pnpm --filter @trustmcp/docs build

  network:
    name: network API (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/network
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11 .venv
      - run: uv pip install --python .venv -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check app tests
      - name: Test
        run: .venv/bin/python -m pytest

  mcp:
    name: MCP server + end-to-end (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11 .venv
      - run: uv pip install --python .venv -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: End-to-end assessment loop
        run: .venv/bin/python -m pytest
