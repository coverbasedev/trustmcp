[project]
name = "trustmcp-mcp"
version = "0.1.0"
description = "TrustMCP MCP server + reference client for the TrustMCP network."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    # the network app is used as an in-process server for the end-to-end test
    "trustmcp-network",
]

[project.scripts]
trustmcp-mcp = "trustmcp_mcp_server:main"

[tool.uv.sources]
trustmcp-network = { path = "../../apps/network", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trustmcp_client.py", "trustmcp_mcp_server.py", "mcp_audit.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
