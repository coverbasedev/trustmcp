[project]
name = "trustmcp-network"
version = "0.1.0"
description = "TrustMCP Network — the reference TrustMCP API (thin trust anchor)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "FSL-1.1-ALv2" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "boto3>=1.35.0",
    "dnspython>=2.7.0",
    "cryptography>=43.0.0",
    "alembic>=1.13.0",
    "pypdf>=5.1.0",
    "reportlab>=4.2.0",
    "anthropic>=0.49.0",
    "pyjwt>=2.8.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "jsonschema>=4.23.0",
]
postgres = [
    "psycopg[binary]>=3.2.0",
]
sentry = [
    "sentry-sdk>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI relies on `Depends()` / `File()` in argument defaults — it's the idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
